org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Configuration cache: on everywhere, including the verify gates and CI (they used to pass
# --no-configuration-cache, so gates never tested the mode IDE builds use). Verified 2026-11-10 on every
# gate task set: no configuration-cache problems. Known limitation: any invocation that includes
# spotlessCheck recalculates the task graph ("input to unknown location has changed") instead of
# reusing the entry; invocations without it (compiles, tests, assemble) reuse it.
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

