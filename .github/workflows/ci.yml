name: CI

on:
  workflow_dispatch:
    inputs:
      android_api_base_url:
        description: 'Debug APK API base URL (use http://10.0.2.2:8080 for emulator, http://<LAN-IP>:8080 or https://<staging-host> for real devices)'
        required: false
        default: 'http://10.0.2.2:8080'
      android_websocket_base_url:
        description: 'Debug APK WebSocket base URL matching the API host'
        required: false
        default: 'ws://10.0.2.2:8080'
  push:
    branches: [main, develop]
  pull_request:

jobs:
  format:
    name: Format (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # spotlessCheck configures every project, including the Android modules, which need the SDK.
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless check
        run: ./gradlew spotlessCheck

  verify:
    name: Verify (tests + assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run verification gate
        # Server integration tests self-manage Postgres/Redis via Testcontainers (Docker is
        # available on ubuntu-latest), so no service containers are required here.
        #
        # :desktopApp:desktopTest rides along here rather than in its own job because it pulls
        # :shared (jvm) -> :composeApp (desktop) -> :desktopApp, all of which this job already
        # builds for :composeApp:desktopTest — a separate job would rebuild them for one task.
        # It matters: adding :desktopApp to settings.gradle.kts put it in NO gate at all, locally
        # or in CI, so the dev shell and DesktopRuntimeConfigTest (which guards a plaintext token
        # store from targeting a real environment) could both break with everything green.
        env:
          ANDROID_API_BASE_URL: ${{ github.event.inputs.android_api_base_url || 'http://10.0.2.2:8080' }}
          ANDROID_WEBSOCKET_BASE_URL: ${{ github.event.inputs.android_websocket_base_url || 'ws://10.0.2.2:8080' }}
        run: >
          ./gradlew
          :shared:jvmTest
          :server:test
          :composeApp:desktopTest
          :desktopApp:desktopTest
          :androidApp:assembleDebug
          -Ppynapli.android.apiBaseUrl="$ANDROID_API_BASE_URL"
          -Ppynapli.android.websocketBaseUrl="$ANDROID_WEBSOCKET_BASE_URL"
      # The release variant is what ships, and until this job existed nothing ever built it: a
      # lint error (NewApi in the base theme) sat in main breaking `assembleRelease` while every
      # gate stayed green on `assembleDebug`. Lint + R8 run here so that fails on the PR instead.
      - name: Verify release variant (lint + minified assemble)
        run: >
          ./gradlew
          :androidApp:lintRelease
          :androidApp:assembleRelease
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-release
          path: androidApp/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pynapli-debug-preview-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web (Wasm compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both token checks run first because they need no Gradle: a violation reports in seconds and
      # isn't hidden behind a failing wasm compile. The second runs even if the first fails, so one
      # CI round reports both kinds of drift.
      #
      # Brand: the marketing site mirrors the app palette by hand (web/src/styles/global.css vs
      # PynapliColors.kt), so without this a palette change forks the brand silently. Run directly
      # rather than ported — pwsh ships on the GitHub ubuntu images.
      - name: Brand token drift check
        shell: pwsh
        run: ./scripts/check-web-tokens.ps1
      # In-app: raw radii/colors in composeApp, webApp and desktopApp feature code. Locally it runs
      # in verify-full/android/web/desktop, but those only run behind the opt-in pre-push hook.
      - name: Compose token drift check
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/check-compose-tokens.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # scripts/verify-web.ps1 covers this locally via the pre-push hook, but the hook is opt-in
      # per clone (core.hooksPath is local config), so the PWA had no CI coverage at all.
      - name: Compile Wasm targets
        run: >
          ./gradlew
          :shared:compileKotlinWasmJs
          :composeApp:compileKotlinWasmJs
          :webApp:compileKotlinWasmJs

  docker-smoke:
    name: Docker Smoke (Cloud Run image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and smoke-test server image
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs --tail 200 pynapli-api-ci || true
              docker compose -p pynapli-ci logs --tail 200 postgres redis || true
            fi
            docker rm -f pynapli-api-ci >/dev/null 2>&1 || true
            docker compose -p pynapli-ci down -v >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          ./gradlew :server:installDist --console=plain
          docker build -f infra/server.Dockerfile -t pynapli-api:ci .

          docker compose -p pynapli-ci up -d postgres redis
          for container in pynapli-postgres pynapli-redis; do
            for attempt in $(seq 1 60); do
              health="$(docker inspect --format='{{.State.Health.Status}}' "$container")"
              if [ "$health" = "healthy" ]; then
                break
              fi
              if [ "$attempt" = "60" ]; then
                echo "$container did not become healthy; last status: $health"
                exit 1
              fi
              sleep 2
            done
          done

          docker run -d \
            --name pynapli-api-ci \
            --network pynapli-ci_default \
            -p 18080:8080 \
            -e PYNAPLI_ENV=local \
            -e PYNAPLI_SERVER_PORT=8080 \
            -e PYNAPLI_DATABASE_URL=jdbc:postgresql://postgres:5432/pynapli_dev \
            -e PYNAPLI_DATABASE_USER=pynapli \
            -e PYNAPLI_DATABASE_PASSWORD=pynapli_dev_password \
            -e PYNAPLI_REDIS_URL=redis://redis:6379 \
            -e PYNAPLI_MEDIA_STORAGE_PROVIDER=local \
            -e PYNAPLI_MEDIA_DEV_AUTO_APPROVE_UPLOADS=true \
            pynapli-api:ci

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "Dockerized API did not pass /health."
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18080/health/deep
