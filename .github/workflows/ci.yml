name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  format:
    name: Format (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # spotlessCheck configures every project, including the Android modules, which need the SDK.
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless check
        run: ./gradlew spotlessCheck --no-configuration-cache

  verify:
    name: Verify (tests + assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run verification gate
        # Server integration tests self-manage Postgres/Redis via Testcontainers (Docker is
        # available on ubuntu-latest), so no service containers are required here.
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest :server:test :composeApp:testAndroidHostTest :composeApp:desktopTest :androidApp:assembleDebug --no-configuration-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
