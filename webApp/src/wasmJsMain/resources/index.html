<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0B0B0E">
    <title>Pynapli</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0B0B0E;
            overflow: hidden;
        }
        #pynapli-app {
            width: 100%;
            height: 100%;
        }
        /* Shown until the wasm bundle takes over the viewport: the brand mark with a
           quiet pulse, so the multi-second first download reads as deliberate. */
        #pynapli-boot {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #pynapli-boot .mark {
            width: 56px;
            height: 56px;
            border-radius: 13px;
            background: #FFC928;
            color: #1a1400;
            font: 600 36px/56px system-ui, sans-serif;
            text-align: center;
            animation: pynapli-pulse 1.6s ease-in-out infinite;
        }
        #pynapli-boot .word {
            color: #6B6660;
            font: 500 13px/1 system-ui, sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        @keyframes pynapli-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.94); opacity: 0.82; }
        }
        @media (prefers-reduced-motion: reduce) {
            #pynapli-boot .mark { animation: none; }
        }
    </style>
    <script type="application/javascript">
        // Production API origin, set here at deploy time so it needs no Wasm rebuild. Leave null
        // to use the api.pynapli.com default baked into the client, or set the deployed API, e.g.
        //   window.__PYNAPLI_API_BASE__ = 'https://api.pynapli.com';
        window.__PYNAPLI_API_BASE__ = null;

        // Captured pre-wasm so the app can offer its own restrained install
        // affordance later (WEB_PWA_GAMEPLAN.md W1.4).
        window.__pynapliInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__pynapliInstallPrompt = e;
            window.dispatchEvent(new Event('pynapli-install-ready'));
        });
        // Dev iterates against the webpack server; caching there hides fresh
        // bundles, so the shell worker only registers off-localhost.
        if ('serviceWorker' in navigator &&
            location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
    <!-- Absolute so the loader resolves at the origin root on multi-segment deep links
         (e.g. /messages/{id}); a relative src resolves to /messages/pynapli.js → 404. -->
    <script type="application/javascript" src="/pynapli.js"></script>
</head>
<body>
<div id="pynapli-boot" aria-label="Pynapli is loading">
    <div class="mark">P</div>
    <div class="word">Pynapli</div>
</div>
<div id="pynapli-app"></div>
</body>
</html>
