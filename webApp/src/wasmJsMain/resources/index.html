<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0B0B0E">
    <title>Pynapli</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0B0B0E;
            overflow: hidden;
        }
        #pynapli-app {
            width: 100%;
            height: 100%;
        }
        /* Shown until the wasm bundle takes over the viewport. */
        #pynapli-boot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6B6660;
            font: 500 14px/1 system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
    <script type="application/javascript">
        // Captured pre-wasm so the app can offer its own restrained install
        // affordance later (WEB_PWA_GAMEPLAN.md W1.4).
        window.__pynapliInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__pynapliInstallPrompt = e;
            window.dispatchEvent(new Event('pynapli-install-ready'));
        });
        // Dev iterates against the webpack server; caching there hides fresh
        // bundles, so the shell worker only registers off-localhost.
        if ('serviceWorker' in navigator &&
            location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
    <script type="application/javascript" src="pynapli.js"></script>
</head>
<body>
<div id="pynapli-boot">Pynapli</div>
<div id="pynapli-app"></div>
</body>
</html>
