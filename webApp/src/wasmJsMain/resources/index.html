<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Pynapli</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0B0B0E;
            overflow: hidden;
        }
        #pynapli-app {
            width: 100%;
            height: 100%;
        }
        /* Shown until the wasm bundle takes over the viewport. */
        #pynapli-boot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6B6660;
            font: 500 14px/1 system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
    <script type="application/javascript" src="pynapli.js"></script>
</head>
<body>
<div id="pynapli-boot">Pynapli</div>
<div id="pynapli-app"></div>
</body>
</html>
